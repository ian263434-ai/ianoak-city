<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IanOak City - GTA Style Game</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial; background: black; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 10px;
      max-width: 240px;
    }
    #hud {
      position: absolute;
      top: 10px;
      right: 10px;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 10px;
      min-width: 160px;
    }
    #controls {
      position: absolute;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
    }
    #joystick {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 100px;
      height: 100px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
    }
  </style>
</head>
<body><div id="ui">
  <h3>IanOak City</h3>
  <p>WASD / Joystick Move</p>
  <p>Car • Shoot • Missions</p>
</div><div id="hud">
  <p>💰 Money: <span id="money">0</span></p>
  <p>🚔 Wanted: <span id="wanted">0</span></p>
  <p>❤️ Health: <span id="health">100</span></p>
  <p>📜 Mission: Collect checkpoints</p>
</div><div id="controls">
  <button onclick="toggleCar()">Car</button>
  <button onclick="shoot()">Shoot</button>
  <button onclick="resetPlayer()">Reset</button>
</div><div id="joystick"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
let scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// GRID ROADS
let road = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshBasicMaterial({color:0x2c8f2c})
);
road.rotation.x = -Math.PI/2;
scene.add(road);

// Buildings
for(let i=0;i<15;i++){
  let b = new THREE.Mesh(
    new THREE.BoxGeometry(5, Math.random()*12+4, 5),
    new THREE.MeshBasicMaterial({color:0x888888})
  );
  b.position.set(Math.random()*100-50,2,Math.random()*100-50);
  scene.add(b);
}

// Player
let player = new THREE.Mesh(
  new THREE.BoxGeometry(1,2,1),
  new THREE.MeshBasicMaterial({color:0xff0000})
);
player.position.y = 1;
scene.add(player);

// Car
let car = new THREE.Mesh(
  new THREE.BoxGeometry(2,1,4),
  new THREE.MeshBasicMaterial({color:0x0000ff})
);
car.position.set(5,0.5,5);
scene.add(car);

// NPCs
let npcs = [];
for(let i=0;i<6;i++){
  let npc = new THREE.Mesh(
    new THREE.BoxGeometry(1,2,1),
    new THREE.MeshBasicMaterial({color:0xffff00})
  );
  npc.position.set(Math.random()*60-30,1,Math.random()*60-30);
  scene.add(npc);
  npcs.push(npc);
}

// Police cars
let police = [];
for(let i=0;i<2;i++){
  let p = new THREE.Mesh(
    new THREE.BoxGeometry(2,1,4),
    new THREE.MeshBasicMaterial({color:0x000000})
  );
  p.position.set(Math.random()*50-25,0.5,Math.random()*50-25);
  scene.add(p);
  police.push(p);
}

// Missions (checkpoints)
let checkpoints = [];
for(let i=0;i<5;i++){
  let c = new THREE.Mesh(
    new THREE.SphereGeometry(1),
    new THREE.MeshBasicMaterial({color:0x00ffff})
  );
  c.position.set(Math.random()*80-40,1,Math.random()*80-40);
  scene.add(c);
  checkpoints.push(c);
}

let bullets = [];
let money = 0;
let wanted = 0;
let health = 100;
let inCar = false;

camera.position.set(0,5,10);

let keys = {};
window.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

// joystick simple
let joy = document.getElementById("joystick");
let joyDir = {x:0,z:0};
let dragging = false;

joy.addEventListener("touchstart",()=>dragging=true);
joy.addEventListener("touchend",()=>{dragging=false;joyDir={x:0,z:0};});
joy.addEventListener("touchmove",(e)=>{
  let t=e.touches[0];
  let rect=joy.getBoundingClientRect();
  let dx=(t.clientX-(rect.left+50))/50;
  let dz=(t.clientY-(rect.top+50))/50;
  joyDir.x=Math.max(-1,Math.min(1,dx));
  joyDir.z=Math.max(-1,Math.min(1,dz));
});

function toggleCar(){
  if(player.position.distanceTo(car.position)<3){
    inCar=!inCar;
  }
}

function resetPlayer(){
  player.position.set(0,1,0);
}

function shoot(){
  let bullet=new THREE.Mesh(
    new THREE.SphereGeometry(0.2),
    new THREE.MeshBasicMaterial({color:0xff0000})
  );
  bullet.position.copy(player.position);
  bullet.dir=new THREE.Vector3(0,0,-1);
  scene.add(bullet);
  bullets.push(bullet);
  wanted=Math.min(5,wanted+1);
}

function updateHUD(){
  document.getElementById("money").innerText=money;
  document.getElementById("wanted").innerText=wanted;
  document.getElementById("health").innerText=health;
}

function updateNPCs(){
  npcs.forEach(n=>{
    n.position.x+=(Math.random()-0.5)*0.2;
    n.position.z+=(Math.random()-0.5)*0.2;
  });
}

function updateBullets(){
  bullets.forEach((b,i)=>{
    b.position.add(b.dir);
    npcs.forEach((n,ni)=>{
      if(b.position.distanceTo(n.position)<1){
        scene.remove(n);
        npcs.splice(ni,1);
        scene.remove(b);
        bullets.splice(i,1);
        money+=10;
      }
    });
  });
}

function updatePolice(){
  if(wanted>0){
    police.forEach(p=>{
      p.position.x += (player.position.x-p.position.x)*0.01;
      p.position.z += (player.position.z-p.position.z)*0.01;
      if(p.position.distanceTo(player.position)<2){
        health-=1;
      }
    });
  }
}

function updateMissions(){
  checkpoints.forEach((c,i)=>{
    if(c && player.position.distanceTo(c.position)<2){
      scene.remove(c);
      checkpoints[i]=null;
      money+=20;
    }
  });
}

function update(){

  let moveSpeed=0.2;
  let dx=(keys['a']?-1:0)+(keys['d']?1:0)+joyDir.x;
  let dz=(keys['w']?-1:0)+(keys['s']?1:0)+joyDir.z;

  if(!inCar){
    player.position.x+=dx*moveSpeed;
    player.position.z+=dz*moveSpeed;

    camera.position.set(player.position.x,5,player.position.z+10);
    camera.lookAt(player.position);
  } else {
    car.position.x+=dx*0.3;
    car.position.z+=dz*0.3;
    player.position.copy(car.position);

    camera.position.set(car.position.x,5,car.position.z+10);
    camera.lookAt(car.position);
  }

  updateNPCs();
  updateBullets();
  updatePolice();
  updateMissions();
  updateHUD();
}

function animate(){
  requestAnimationFrame(animate);
  update();
  renderer.render(scene,camera);
}

animate();
</script></body>
</html>
